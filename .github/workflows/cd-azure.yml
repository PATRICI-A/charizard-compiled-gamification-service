name: CD – Azure App Service Deploy

on:
  push:
    branches:
      - main

env:
  JAVA_VERSION: '21'

jobs:

  deploy:
    name: "Deploy to Azure App Service"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build application
        run: mvn clean package -DskipTests

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        run: |
          JAR_FILE=$(ls target/*.jar | head -1)
          az webapp deploy --resource-group rg-patricia-prod --name ${{ secrets.AZURE_APP_SERVICE_NAME }} --type jar --src-path "$JAR_FILE"
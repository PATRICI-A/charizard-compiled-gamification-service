version: '3.9'

services:
  gamification-service:
    build: .
    container_name: gamification-service
    ports:
      - "8086:8080"
    environment:
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI:-mongodb+srv://shaddaygonzalez5_db_user:UhQV85Jf9l2dYkpS@cluster0.grwrgmg.mongodb.net/gamification_db?appName=Cluster0}
      JWT_SECRET: ${JWT_SECRET:-P4tric1A-Auth-S3rv1c3-S3cr3t-K3y-2026!!}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-https://patricia-gamification-service-cfdyfqckhehrbmfb.canadacentral-01.azurewebsites.net}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - charizard-network
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: gamification-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: gamification_db
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - charizard-network
    restart: unless-stopped

networks:
  charizard-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:

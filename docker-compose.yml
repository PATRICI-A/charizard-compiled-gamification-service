version: '3.9'

services:
  gamification-service:
    build: .
    container_name: gamification-service
    ports:
      - "8086:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/gamification_db
      JWT_SECRET: ${JWT_SECRET:-charizard-compiled-secret-key-2025-very-long-key-for-hs256}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://localhost:8085}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - charizard-network
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: gamification-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: gamification_db
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - charizard-network
    restart: unless-stopped

networks:
  charizard-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:

server:
  port: 8086

spring:
  application:
    name: gamification-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/gamification_db}
      auto-index-creation: true

  security:
    jwt:
      secret: ${JWT_SECRET:charizard-compiled-secret-key-2025-very-long-key-for-hs256}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

services:
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}

scheduling:
  weekly-reset:
    cron: "0 0 0 * * MON"   # Lunes a medianoche
